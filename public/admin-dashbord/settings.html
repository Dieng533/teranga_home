<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paramètres - Teranga Home Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="admin.html">
        <img src="../assets/images/logo_casahome.png" alt="Teranga Home" height="36" class="me-2">
        <strong>Admin</strong>
      </a>
      <div class="ms-auto d-flex align-items-center">
        <a href="profile.html" class="btn btn-outline-secondary btn-sm me-2"><i class="bi bi-person me-1"></i>Profil</a>
        <a href="#" id="logoutBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Déconnexion</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h5 mb-3">Préférences générales</h1>
            <form id="prefsForm" class="row g-3">
              <div class="col-12">
                <label class="form-label">Langue</label>
                <select id="lang" class="form-select">
                  <option value="fr">Français</option>
                  <option value="en">English</option>
                </select>
              </div>
              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="darkMode">
                  <label class="form-check-label" for="darkMode">Mode sombre</label>
                </div>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="emailNotif">
                  <label class="form-check-label" for="emailNotif">Recevoir les notifications par email</label>
                </div>
              </div>
              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Enregistrer</button>
                <button type="button" id="resetPrefs" class="btn btn-outline-secondary">Réinitialiser</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">Compte</h2>
            <form id="accountForm" class="row g-3">
              <div class="col-12">
                <label class="form-label">Adresse e-mail de contact</label>
                <input type="email" class="form-control" id="contactEmail" placeholder="email@exemple.com">
              </div>
              <div class="col-12">
                <label class="form-label">Téléphone de contact</label>
                <input type="tel" class="form-control" id="contactPhone" placeholder="+221 ...">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-outline-primary"><i class="bi bi-person-check me-1"></i>Mettre à jour</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const PREFS_KEY = 'adminPreferences';
    const USER_KEY = 'adminCurrentUser';

    function getPrefs() {
      try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (_) { return {}; }
    }
    function savePrefs(p) {
      localStorage.setItem(PREFS_KEY, JSON.stringify(p));
    }

    function populatePrefs() {
      const p = getPrefs();
      document.getElementById('lang').value = p.lang || 'fr';
      document.getElementById('darkMode').checked = !!p.darkMode;
      document.getElementById('emailNotif').checked = !!p.emailNotif;
    }

    function populateAccount() {
      try {
        const u = JSON.parse(localStorage.getItem(USER_KEY)) || {};
        document.getElementById('contactEmail').value = u.email || '';
        document.getElementById('contactPhone').value = u.phone || '';
      } catch (_) {}
    }

    document.getElementById('prefsForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const p = getPrefs();
      p.lang = document.getElementById('lang').value;
      p.darkMode = document.getElementById('darkMode').checked;
      p.emailNotif = document.getElementById('emailNotif').checked;
      savePrefs(p);
      const btn = e.submitter; btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enregistré';
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Enregistrer'; }, 1200);
    });

    document.getElementById('resetPrefs').addEventListener('click', () => {
      localStorage.removeItem(PREFS_KEY);
      populatePrefs();
    });

    document.getElementById('accountForm').addEventListener('submit', (e) => {
      e.preventDefault();
      try {
        const u = JSON.parse(localStorage.getItem(USER_KEY)) || {};
        u.email = document.getElementById('contactEmail').value.trim();
        u.phone = document.getElementById('contactPhone').value.trim();
        localStorage.setItem(USER_KEY, JSON.stringify(u));
        alert('Coordonnées mises à jour');
      } catch (_) {}
    });

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      sessionStorage.removeItem(USER_KEY);
      window.location.href = '../admin-dashbord/admin-login.html';
    });

    populatePrefs();
    populateAccount();
  </script>
</body>
</html>
